        <line x1="10" y1="46" x2="12" y2="44" /><line x1="18" y1="38" x2="20" y2="36" />
        <circle cx="2" cy="54" r="2" />
        <path d="M 32 4 L 50 8 L 54 22 L 48 28 L 36 24 L 32 20 Z" />
        <path d="M 36 8 L 48 11" /><line x1="36" y1="12" x2="46" y2="14" />
        <path d="M 50 8 Q 56 14 54 22" />
