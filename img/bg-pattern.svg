        <rect x="55" y="12" width="7" height="12" /><rect x="54" y="10" width="9" height="3" />
        <rect x="8" y="28" width="64" height="38" />
        <line x1="8" y1="42" x2="72" y2="42" />
        <rect x="14" y="38" width="12" height="12" /><line x1="20" y1="38" x2="20" y2="50" />
        <line x1="14" y1="44" x2="26" y2="44" />
        <rect x="54" y="38" width="12" height="12" /><line x1="60" y1="38" x2="60" y2="50" />
        <line x1="54" y1="44" x2="66" y2="44" />
        <rect x="34" y="48" width="12" height="18" /><line x1="40" y1="48" x2="40" y2="66" />
        <line x1="30" y1="66" x2="50" y2="66" />
      </g>
    </symbol>

