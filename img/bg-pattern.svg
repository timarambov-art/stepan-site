        <line x1="25" y1="3" x2="25" y2="7" /><line x1="25" y1="43" x2="25" y2="47" />
        <line x1="3" y1="25" x2="7" y2="25" /><line x1="43" y1="25" x2="47" y2="25" />
        <line x1="9" y1="9" x2="12" y2="12" /><line x1="38" y1="38" x2="41" y2="41" />
        <line x1="9" y1="41" x2="12" y2="38" /><line x1="38" y1="12" x2="41" y2="9" />
        <line x1="18" y1="5" x2="19" y2="8" /><line x1="32" y1="5" x2="31" y2="8" />
        <line x1="18" y1="45" x2="19" y2="42" /><line x1="32" y1="45" x2="31" y2="42" />
        <line x1="25" y1="8" x2="25" y2="42" /><line x1="8" y1="25" x2="42" y2="25" />
        <line x1="13" y1="13" x2="37" y2="37" /><line x1="13" y1="37" x2="37" y2="13" />
