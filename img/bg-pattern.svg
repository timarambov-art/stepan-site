        <path d="M 16 32 Q 24 28 32 32" /><path d="M 36 32 Q 44 28 52 32" />
        <path d="M 20 40 L 18 44 Q 20 46 22 44 Z" />
        <path d="M 36 42 L 34 46 Q 36 48 38 46 Z" />
        <path d="M 52 40 L 50 44 Q 52 46 54 44 Z" />
