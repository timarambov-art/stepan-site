        <line x1="24" y1="2" x2="24" y2="58" /><line x1="27" y1="2" x2="27" y2="58" />
        <rect x="7" y="8" width="17" height="3" /><rect x="7" y="18" width="17" height="3" />
        <rect x="7" y="28" width="17" height="3" /><rect x="7" y="38" width="17" height="3" />
        <rect x="7" y="48" width="17" height="3" />
