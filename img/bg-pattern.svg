        <circle cx="44" cy="20" r="5" />
        <path d="M 48 18 L 54 16 L 48 20 Z" />
        <path d="M 14 22 Q 22 10 32 14 Q 28 22 20 24 Q 14 26 14 22 Z" />
        <path d="M 2 24 L -6 20 L -4 26 L -6 30 Z" />
        <line x1="18" y1="30" x2="18" y2="36" /><line x1="24" y1="30" x2="24" y2="36" />
      </g>
    </symbol>

