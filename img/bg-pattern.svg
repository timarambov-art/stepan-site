        <path d="M 30 56 L 30 42 L 18 48 L 20 36 L 6 38 L 14 26 L 2 20 L 14 16 L 10 4 L 22 8 L 24 2 L 30 8 L 36 2 L 38 8 L 50 4 L 46 16 L 58 20 L 46 26 L 54 38 L 40 36 L 42 48 L 30 42 Z" />
        <line x1="30" y1="42" x2="30" y2="10" />
        <line x1="30" y1="22" x2="18" y2="14" /><line x1="30" y1="22" x2="42" y2="14" />
        <line x1="30" y1="30" x2="12" y2="26" /><line x1="30" y1="30" x2="48" y2="26" />
