        <line x1="17" y1="22" x2="23" y2="22" /><line x1="17" y1="34" x2="23" y2="34" />
        <line x1="17" y1="46" x2="23" y2="46" /><line x1="17" y1="52" x2="23" y2="52" />
        <path d="M 4 4 L 14 4 L 14 2 L 26 2 L 26 4 L 36 4 L 36 14 L 26 14 L 26 16 L 14 16 L 14 14 L 4 14 Z" />
