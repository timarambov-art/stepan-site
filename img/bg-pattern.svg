        <line x1="30" y1="22" x2="30" y2="28" /><line x1="40" y1="22" x2="40" y2="28" />
        <line x1="25" y1="34" x2="25" y2="38" /><line x1="45" y1="34" x2="45" y2="38" />
      </g>
    </symbol>

    <symbol id="carabiner" overflow="visible">
