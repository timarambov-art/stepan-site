  <!-- Сетка 7x7, шаг 80px. Крупные иконки с scale 0.75 умещаются в ячейку.
       Иконки центрированы вокруг (0,0) — не выходят за свою ячейку, пересечений нет. -->
  <g class="ic">

    <!-- РЯД 1 (y=40) -->
    <use href="#tower"       x="40"  y="40"  transform="rotate(-14 40 40) scale(0.75)"/>
    <use href="#saw"         x="120" y="40"  transform="rotate(55 120 40)"/>
    <use href="#tree"        x="200" y="40"  transform="rotate(20 200 40) scale(0.85)"/>
    <use href="#carabiner"   x="280" y="40"  transform="rotate(-32 280 40) scale(0.9)"/>
    <use href="#snowflake"   x="360" y="40"  transform="rotate(15 360 40)"/>
    <use href="#chainsaw"    x="440" y="40"  transform="rotate(-25 440 40) scale(0.75)"/>
    <use href="#pinecone"    x="520" y="40"  transform="rotate(40 520 40)"/>

    <!-- РЯД 2 (y=120) -->
    <use href="#house"       x="40"  y="120" transform="rotate(-8 40 120) scale(0.75)"/>
    <use href="#nut"         x="120" y="120" transform="rotate(30 120 120)"/>
    <use href="#rope"        x="200" y="120" transform="rotate(25 200 120) scale(0.9)"/>
    <use href="#cutter"      x="280" y="120" transform="rotate(0 280 120) scale(0.9)"/>
    <use href="#helmet"      x="360" y="120" transform="rotate(12 360 120) scale(0.85)"/>
    <use href="#ladder"      x="440" y="120" transform="rotate(28 440 120) scale(0.9)"/>
    <use href="#maple"       x="520" y="120" transform="rotate(-20 520 120) scale(0.75)"/>

    <!-- РЯД 3 (y=200) -->
    <use href="#screwdriver" x="40"  y="200" transform="rotate(-45 40 200)"/>
    <use href="#bolt"        x="120" y="200" transform="rotate(20 120 200)"/>
    <use href="#grinder"     x="200" y="200" transform="rotate(-30 200 200)"/>
    <use href="#acorn"       x="280" y="200" transform="rotate(45 280 200)"/>
    <use href="#star"        x="360" y="200" transform="rotate(10 360 200)"/>
    <use href="#icicle"      x="440" y="200" transform="rotate(5 440 200)"/>
    <use href="#branch"      x="520" y="200" transform="rotate(60 520 200)"/>

    <!-- РЯД 4 (y=280) -->
    <use href="#axe"         x="40"  y="280" transform="rotate(35 40 280) scale(0.85)"/>
    <use href="#hammer"      x="120" y="280" transform="rotate(-48 120 280) scale(0.9)"/>
    <use href="#cloud"       x="200" y="280" transform="rotate(8 200 280) scale(0.75)"/>
    <use href="#tree"        x="280" y="280" transform="rotate(-16 280 280) scale(0.75)"/>
    <use href="#chainsaw"    x="360" y="280" transform="rotate(42 360 280) scale(0.75)"/>
    <use href="#bird"        x="440" y="280" transform="rotate(-5 440 280) scale(0.85)"/>
    <use href="#carabiner"   x="520" y="280" transform="rotate(22 520 280) scale(0.75)"/>

    <!-- РЯД 5 (y=360) -->
    <use href="#star"        x="40"  y="360" transform="rotate(-30 40 360)"/>
    <use href="#pinecone"    x="120" y="360" transform="rotate(-20 120 360) scale(0.9)"/>
    <use href="#nut"         x="200" y="360" transform="rotate(-20 200 360)"/>
    <use href="#snowflake"   x="280" y="360" transform="rotate(-25 280 360) scale(0.9)"/>
    <use href="#rope"        x="360" y="360" transform="rotate(-18 360 360) scale(0.85)"/>
    <use href="#saw"         x="440" y="360" transform="rotate(40 440 360)"/>
    <use href="#maple"       x="520" y="360" transform="rotate(50 520 360) scale(0.75)"/>

    <!-- РЯД 6 (y=440) -->
    <use href="#ladder"      x="40"  y="440" transform="rotate(-35 40 440) scale(0.85)"/>
    <use href="#hook"        x="120" y="440" transform="rotate(25 120 440) scale(0.9)"/>
    <use href="#branch"      x="200" y="440" transform="rotate(-40 200 440)"/>
    <use href="#helmet"      x="280" y="440" transform="rotate(-10 280 440) scale(0.85)"/>
    <use href="#cutter"      x="360" y="440" transform="rotate(15 360 440) scale(0.85)"/>
    <use href="#star"        x="440" y="440" transform="rotate(20 440 440)"/>
    <use href="#screwdriver" x="520" y="440" transform="rotate(60 520 440)"/>

    <!-- РЯД 7 (y=520) -->
    <use href="#bird"        x="40"  y="520" transform="rotate(28 40 520) scale(0.85)"/>
    <use href="#cloud"       x="120" y="520" transform="rotate(-22 120 520) scale(0.75)"/>
    <use href="#tower"       x="200" y="520" transform="rotate(20 200 520) scale(0.75)"/>
    <use href="#bolt"        x="280" y="520" transform="rotate(-15 280 520)"/>
    <use href="#acorn"       x="360" y="520" transform="rotate(15 360 520)"/>
    <use href="#hammer"      x="440" y="520" transform="rotate(45 440 520) scale(0.85)"/>
    <use href="#tree"        x="520" y="520" transform="rotate(10 520 520) scale(0.75)"/>

  </g>
</svg>
