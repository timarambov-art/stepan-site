        <path d="M 2 55 L 2 50 Q 2 46 6 46 L 70 46 Q 74 46 74 50 L 74 55" />
        <circle cx="14" cy="58" r="5" /><circle cx="14" cy="58" r="2" />
        <circle cx="62" cy="58" r="5" /><circle cx="62" cy="58" r="2" />
        <rect x="4" y="30" width="20" height="16" rx="1" />
        <line x1="7" y1="33" x2="20" y2="33" /><line x1="13" y1="33" x2="13" y2="42" />
        <path d="M 2 55 L -2 62" /><path d="M 74 55 L 78 62" />
        <path d="M 30 42 L 30 32 L 48 18 L 66 8" /><path d="M 34 42 L 34 32 L 52 18 L 68 10" />
        <line x1="30" y1="32" x2="34" y2="32" />
        <rect x="60" y="4" width="14" height="9" rx="1" /><line x1="60" y1="7" x2="74" y2="7" />
        <line x1="30" y1="40" x2="45" y2="30" />
      </g>
    </symbol>

    <symbol id="tree" overflow="visible">
