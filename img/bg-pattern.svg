<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560">
  <defs>
    <style>
      .ic { fill: none; stroke: #2d4a2a; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0.32; }
      .ic-fill { fill: #2d4a2a; opacity: 0.32; }
