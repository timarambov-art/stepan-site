        <line x1="4" y1="13" x2="10" y2="13" /><line x1="4" y1="17" x2="10" y2="17" />
        <path d="M 12 11 L 12 19 L 30 17 L 30 13 Z" />
        <path d="M 30 13 L 42 15 L 30 17 Z" />
