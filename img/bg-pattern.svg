        <rect x="26" y="12" width="30" height="20" rx="3" />
        <line x1="30" y1="16" x2="36" y2="16" /><line x1="30" y1="19" x2="36" y2="19" />
        <line x1="30" y1="22" x2="36" y2="22" /><line x1="30" y1="25" x2="36" y2="25" />
        <line x1="30" y1="28" x2="36" y2="28" />
        <circle cx="46" cy="22" r="4" /><circle cx="46" cy="22" r="1.5" class="ic-fill" />
        <path d="M 32 12 L 32 4 L 54 4 L 54 12" /><path d="M 32 8 L 54 8" />
        <path d="M 56 20 L 66 16 L 66 28 L 56 24" />
        <path d="M 26 20 Q 24 20 24 22 L 4 22 Q 2 22 2 24 L 2 26 Q 2 28 4 28 L 24 28 Q 26 28 26 26 Z" />
        <line x1="6" y1="22" x2="6" y2="19" /><line x1="12" y1="22" x2="12" y2="19" />
        <line x1="18" y1="22" x2="18" y2="19" /><line x1="24" y1="22" x2="24" y2="19" />
        <line x1="6" y1="28" x2="6" y2="31" /><line x1="12" y1="28" x2="12" y2="31" />
        <line x1="18" y1="28" x2="18" y2="31" /><line x1="24" y1="28" x2="24" y2="31" />
        <path d="M 32 34 L 28 44 L 48 44 L 44 34" />
